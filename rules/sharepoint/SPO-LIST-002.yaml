# A documented limit. The number is Microsoft's, the consequence is Microsoft's,
# and both are stated here next to the observed value.

schema_version: "1.0"
id: SPO-LIST-002
version: "1.0"
title: A list or library may not hold more than 50,000 unique permission scopes
description: >
  Every time inheritance is broken on an item, a folder or the list itself, a
  new unique permission scope is created. SharePoint supports 50,000 of them
  per list or library. Reaching that ceiling does not degrade the list: it
  stops the next person being able to share anything in it individually, and
  the failure arrives at the moment somebody tries.

service: sharepoint
resource_type: list

basis:
  type: documented-limit
  limit:
    value: 50000
    unit: unique permission scopes
    statement: >
      "The supported limit of unique permissions for items in a list or
      library is 50,000. However, the recommended general limit is 5,000."
  sources:
    - url: https://learn.microsoft.com/office365/servicedescriptions/sharepoint-online-service-description/sharepoint-online-limits
      title: SharePoint limits, Unique security scopes per list or library
      publisher: Microsoft
      checked_at: "2026-08-06"
    - url: https://learn.microsoft.com/sharepoint/manage-permission-scope
      title: Manage Permission Scopes in SharePoint
      publisher: Microsoft
      checked_at: "2026-08-06"
  rationale: >
    The number is enforced by the product rather than recommended by it. The
    second source states what a scope is and how one is created, which is what
    makes the count reproducible by a reader: breaking inheritance on a file
    or folder creates a scope, and two files sharing an inherited ACL do not.

severity:
  default: high
  rationale: >
    Rated above the boundary rules because the consequence lands on somebody
    doing ordinary work: a person tries to share a document and cannot, with
    an error that does not explain itself. It is not critical because nothing
    is exposed and no data is lost, and the ceiling can be lowered again by
    restructuring.
  configurable: true

evidence_requirements:
  - path: permissions.unique_scope_count
    type: integer
    required: true

condition:
  operator: greater-than
  evidence: permissions.unique_scope_count
  value: 50000

outcomes:
  pass:
    message: >
      The list holds {permissions.unique_scope_count} unique permission scopes,
      within the supported limit of 50,000.
  fail:
    message: >
      The list holds {permissions.unique_scope_count} unique permission scopes,
      above the supported limit of 50,000. Sharing anything in this list
      individually will fail from here on.
  unknown:
    message: >
      The scope count does not settle this list's position relative to the
      50,000 limit: either it was not counted, or counting stopped before it
      could. The evidence beside this finding says which. This is not a pass.
  not_applicable:
    message: >
      This rule does not apply to this resource.
  invalid_evidence:
    message: >
      The scope count was returned in a form this rule cannot evaluate. The
      collector output does not match the evidence schema.

remediation: >
  Restructure the content so that fewer containers carry their own
  permissions. A folder shared with three people is one scope; three files
  shared individually are three. Where a list has grown past the ceiling, the
  supported route is to split the content across containers rather than to
  remove permissions one by one, which is slow and rarely finishes.

limitations:
  passes_without_resolving: >
    A list at 49,000 scopes passes and is one sharing operation away from the
    ceiling, and a list at 6,000 passes this rule while sitting well above the
    number Microsoft recommends for performance. This rule measures only the
    supported ceiling, and passing it says nothing about whether the list is
    usable.
  other:
    - >
      Counting scopes requires walking the items of the list. A collector that
      stopped early reports a lower bound, and this rule then answers only
      when that bound already settles the question.
    - >
      The rule does not read the scopes themselves. It cannot say who has
      access, or whether any of it is intentional.
