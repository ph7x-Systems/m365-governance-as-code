name: Publish

# Publishing happens on a published GitHub release and nowhere else.
#
# Not on a tag push. A tag can be moved, and a workflow that publishes on one
# will happily push a second artefact for a version that already exists. A
# release is a deliberate act with a person behind it, and it is the only
# trigger here.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build the distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build
        run: |
          python -m pip install --upgrade build
          python -m build

      # The version in pyproject.toml and the tag that triggered this must be
      # the same thing. They drift the first time somebody tags a release and
      # forgets to bump, and the result is a distribution whose filename
      # disagrees with the release everybody is looking at.
      - name: The built version is the released version
        run: |
          built=$(ls dist/*.tar.gz | sed -E 's/.*-(.*)\.tar\.gz/\1/')
          tag="${GITHUB_REF_NAME#v}"
          if [ "$built" != "$tag" ]; then
            echo "release tag is '$tag' and the build produced '$built'." >&2
            echo "Bump the version in pyproject.toml, or retag." >&2
            exit 1
          fi
          echo "$built"

      # Twine reads the metadata the way PyPI will. Finding out that a long
      # description does not render is cheaper here than after an upload that
      # cannot be replaced: a version number on PyPI is spent the moment it is
      # used, deleted or not.
      - name: Check the metadata the way PyPI will
        run: |
          python -m pip install --upgrade twine
          python -m twine check --strict dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest

    # A dedicated environment, so publishing rights are not the same thing as
    # commit rights. Anybody who can push can trigger CI; only what this
    # environment allows can reach PyPI.
    environment:
      name: pypi
      url: https://pypi.org/p/m365-governance-as-code

    # The only credential is a short-lived OIDC token minted for this run.
    # There is no API token in a secret to leak, rotate or forget.
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
