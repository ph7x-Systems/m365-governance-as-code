name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  dco:
    # Every commit in the pull request carries a Developer Certificate of
    # Origin sign-off. A policy in CONTRIBUTING.md that nothing checks is a
    # policy the first contributor discovers by not following it.
    #
    # It names the commits that are missing it. "DCO check failed" with nothing
    # behind it is the message this project exists to stop shipping.
    name: Signed off under the DCO
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole range, not a shallow clone: a shallow one cannot see the
          # commits being merged and would pass by inspecting nothing.
          fetch-depth: 0
      - name: Every commit is signed off
        run: ./tools/dco-check.sh
          "${{ github.event.pull_request.base.sha }}"
          "${{ github.event.pull_request.head.sha }}"

  contract:
    name: Release contract
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      # CI does not decide what healthy means. The repository does.
      # Everything this job does is prepare an interpreter and run one
      # command — the same one a developer runs locally. A gate that existed
      # only here would not exist: the developer would prove one thing and CI
      # another, which is two definitions of healthy, one too many.
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Environment
        run: |
          python -m pip install --upgrade pip build
          pip install -e .
          pip install -r requirements-dev.txt

      # The full contract measures the PnP surface against a committed
      # baseline, so the module has to be here. Without it the detector cannot
      # tell whether anything moved, and "could not check" is not "nothing
      # changed": the contract refuses to pass on a silence.
      - name: PnP.PowerShell, for the surface and drift gates
        if: matrix.python-version == '3.13'
        shell: pwsh
        run: Install-Module PnP.PowerShell -RequiredVersion 3.3.0 -Force -Scope CurrentUser -AllowClobber

      - name: ./tools/release-check.sh
        # The wheel and clean-install gates answer a question that does not
        # depend on the interpreter, and pwsh is only present on one entry, so
        # they run once rather than three times. Everything else runs on every
        # version of Python the package claims to support.
        run: |
          if [ "${{ matrix.python-version }}" = "3.13" ]; then
            ./tools/release-check.sh
          else
            ./tools/release-check.sh --no-install
          fi

  journey:
    # THE JOURNEY WHERE NOTHING IS INSTALLED, on the systems a reader has.
    #
    # Rule 5 of the charter's continuation procedure: with no new authority
    # available, get new observation. Every defect found on 2026-08-20 was
    # found by running, none by reading, with a green gate over all of them —
    # and the contract job above proves the repository, never the artefact a
    # person installs.
    #
    # WINDOWS IS THE POINT. The reader of this product is a Microsoft 365
    # administrator and is mostly on Windows, and this engine branches on no
    # platform anywhere. The queue recorded Windows as needing a machine the
    # owner would have to supply; it needed a runner of the same class already
    # in use, which is what happens when a card's state is inherited instead of
    # its resolutions being read.
    #
    # The image carries PowerShell 7 beside Windows PowerShell 5.1, which is
    # the question itself: which one `shutil.which("pwsh")` resolves.
    #
    # WHAT IT DOES NOT SETTLE: a PFX under another credential store. Saying so
    # here keeps a green job from standing for the whole question.
    name: The journey, installed
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Built here and installed from the wheel, never `pip install -e .`: an
      # editable install resolves against the checkout, and what a reader has
      # is a package.
      - name: Build and install the artefact
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist .
          # THE WHEEL BY PATH, NOT BY NAME. `--find-links dist` only ADDS the
          # local wheel as a candidate: PyPI stays in the resolution, and with
          # the same version number published there, pip installed the RELEASED
          # package instead of the one just built. The job then walked the
          # journey of the last release on three operating systems and reported
          # it as this branch's - which is how a fix committed here failed the
          # gate written to prove it.
          #
          # `--no-index` is not the fix: it blocks the dependencies too, and
          # this package needs PyYAML from PyPI. Naming the file installs
          # exactly the artefact and resolves its requirements normally. It is
          # done in Python because the three runners do not agree on globs.
          python -c "import glob, subprocess, sys; subprocess.check_call([sys.executable, '-m', 'pip', 'install', glob.glob('dist/*.whl')[0]])"

      - name: The journey a reader walks
        run: python tools/journey-check.py
