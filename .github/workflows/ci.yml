name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rules:
    name: Rules and tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check src tools tests

      - name: Format
        run: ruff format --check src tools tests

      - name: Validate every rule
        # Layers 1 to 4: the file is a document, one field, one file with its
        # references followed, every file together.
        run: m365-governance validate --rules rules

      - name: Schemas are valid JSON Schema
        run: |
          python - <<'PY'
          import json, pathlib
          from jsonschema import Draft202012Validator
          for p in sorted(pathlib.Path("schemas").glob("*.json")):
              Draft202012Validator.check_schema(json.loads(p.read_text()))
              print(f"{p}: valid")
          PY

      - name: Tests
        # A skipped test is a test nobody ran. -ra surfaces any, and the next
        # step refuses them.
        run: pytest -q -ra --strict-markers | tee /tmp/pytest.out

      - name: Coverage
        # A floor rather than a number in a report nobody reads. It was
        # measured for the first time at 0.8.0 and found the bounded
        # comparison at 86 per cent: nearly the whole table published in
        # ARCHITECTURE.md had never executed. A documented claim that nothing
        # runs is a claim that drifts.
        if: matrix.python-version == '3.13'
        run: |
          coverage run -m pytest -q
          coverage report

      - name: No skipped tests
        run: |
          if grep -qE '[0-9]+ skipped' /tmp/pytest.out; then
            echo "::error::the suite contains skipped tests"
            exit 1
          fi

      - name: Examples are current
        # An example in a README is read as a promise. A hand-edited one is a
        # promise nobody is keeping: it stays plausible while the behaviour
        # moves underneath it.
        run: python tools/examples.py --check

      - name: Collector is read-only
        # A step rather than a job, and the reason is exposure rather than
        # tidiness. It ran as its own job, which meant a second runner and a
        # second `actions/checkout` to resolve. On 2026-08-06 the first job
        # resolved its actions and this one could not, in the same run, in the
        # same minute, for the same action. The check itself takes three
        # seconds; a whole job's worth of dependency on GitHub resolving a
        # download was the wrong price for it.
        #
        # One matrix entry, because the answer does not depend on Python.
        #
        # What this proves is narrower than its name. It establishes that the
        # file is analysable and that no command in it begins with a mutating
        # verb. It runs nothing: a function can parse cleanly, pass this walk,
        # and throw on its first line against a tenant, which is exactly what
        # the first version of Get-ClassificationFacts did. It would also miss
        # a write reached through a variable or a REST call. A floor under
        # review, not a substitute for it. See docs/ARCHITECTURE.md, "What the
        # gates prove, and what they do not".
        if: matrix.python-version == '3.13'
        shell: pwsh
        run: |
          $path = 'collectors/powershell/sharepoint/Get-SpoEvidence.ps1'
          $errs = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$null, [ref]$errs)
          if ($errs) { $errs | ForEach-Object { Write-Error $_.Message }; exit 1 }
          $ast = [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$null, [ref]$null)
          $names = $ast.FindAll({ param($n) $n -is [System.Management.Automation.Language.CommandAst] }, $true) |
                   ForEach-Object { $_.GetCommandName() } | Sort-Object -Unique
          $writes = $names | Where-Object { $_ -match '^(Set|New|Remove|Add|Update|Grant|Revoke)-(PnP|Mg|SPO)' }
          if ($writes) { Write-Error "write path in a read-only collector: $writes"; exit 1 }
          Write-Host "no write path"

      - name: Every fixture evaluates
        run: |
          for f in fixtures/sharepoint/*.json; do
            m365-governance evaluate --rules rules --evidence "$f" --format json > /dev/null
          done
          echo "all fixtures evaluated"
