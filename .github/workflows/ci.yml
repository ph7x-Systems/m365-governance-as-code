name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Rules and tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r requirements-dev.txt

      - name: Validate every rule
        run: m365-governance validate --rules rules

      - name: Tests
        # A skipped test is a test nobody ran. The suite must not contain one.
        run: pytest -q -rs --strict-markers

      - name: No skipped tests
        run: |
          skipped=$(pytest -q --collect-only 2>/dev/null | tail -1)
          echo "collected: $skipped"
          pytest -q 2>&1 | tee /tmp/pytest.out
          if grep -qE '[0-9]+ skipped' /tmp/pytest.out; then
            echo "::error::the suite contains skipped tests"
            exit 1
          fi

      - name: Every fixture evaluates
        run: |
          for f in fixtures/sharepoint/*.json; do
            echo "--- $f"
            m365-governance evaluate --rules rules --evidence "$f" --format json > /dev/null
          done

  collector:
    name: Collector is read-only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse the collector and prove it cannot write
        shell: pwsh
        run: |
          $path = 'collectors/powershell/sharepoint/Get-SpoEvidence.ps1'
          $errs = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$null, [ref]$errs)
          if ($errs) { $errs | ForEach-Object { Write-Error $_.Message }; exit 1 }
          $ast = [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$null, [ref]$null)
          $names = $ast.FindAll({ param($n) $n -is [System.Management.Automation.Language.CommandAst] }, $true) |
                   ForEach-Object { $_.GetCommandName() } | Sort-Object -Unique
          $writes = $names | Where-Object { $_ -match '^(Set|New|Remove|Add|Update|Grant|Revoke)-(PnP|Mg|SPO)' }
          if ($writes) { Write-Error "write path in a read-only collector: $writes"; exit 1 }
          Write-Host "no write path"
