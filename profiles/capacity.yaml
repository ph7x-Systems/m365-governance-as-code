# Pairs with `collect permissions` and `collect capacity`.
#
# Two documented limits, one documented recommendation and one threshold of
# ours, kept together because they answer the same question: what is close to
# stopping working, and what has already stopped being possible.

name: capacity
description: >
  Limits reached, limits approaching, and the one number that is ours rather
  than Microsoft's. Evaluate against list and site evidence.

rules:
  - SPO-LIST-001
  - SPO-LIST-002
  - SPO-LIST-003
  - SPO-SITE-003

# What the profile does with a class, and the word matters: it sets aside, it
# never excludes. A set-aside resource is still collected, still evaluated,
# still counted, and still printed, under its own heading at the end.
#
# The alternative was to drop them, and the alternative is dangerous. A
# document library holding 60,000 unique permission scopes is over a hard
# product limit whoever created it, and SharePoint calling it a catalog is not
# a reason for a governance report to stay silent about it.
set_aside_classes:
  - system
