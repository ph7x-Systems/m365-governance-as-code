[build-system]
# 77 and not 68: `license = "MIT"` with `license-files` is PEP 639, and
# setuptools grew it in 77. Left at 68, a clean build environment could
# resolve a version that does not understand the field and either fail or
# quietly drop the licence from the metadata.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "m365-governance-as-code"
version = "1.0.0b8"
description = "Microsoft 365 governance checks that show their work."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "pH7x Systems", email = "support@ph7x.com" }]
keywords = ["microsoft-365", "sharepoint", "governance", "policy-as-code"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: System Administrators",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  # The versions CI actually runs the suite against. A classifier claiming a
  # version nothing tests is a promise the project has not made.
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Systems Administration",
]
dependencies = ["PyYAML>=6.0", "jsonschema>=4.20"]

# The links PyPI shows beside the description. Worth setting before the first
# release rather than after: the sidebar is most of what somebody deciding
# whether to try this will read, and a version number is spent the moment it
# is used, deleted or not.
# THE STANDALONE BUILD, WHICH IS NOT A RUNTIME DEPENDENCY. A consumer that
# ships this engine needs a build of it that runs without a Python
# installation; nobody installing the command line from PyPI needs PyInstaller,
# and putting it in `dependencies` would make every user carry a build tool.
[project.optional-dependencies]
packaging = ["pyinstaller>=6.22"]

[project.urls]
Homepage = "https://ph7x.com/tools/m365-governance-as-code/"
Documentation = "https://ph7x.com/tools/m365-governance-as-code/docs/"
Repository = "https://github.com/ph7x-Systems/m365-governance-as-code"
Issues = "https://github.com/ph7x-Systems/m365-governance-as-code/issues"
Changelog = "https://github.com/ph7x-Systems/m365-governance-as-code/blob/main/CHANGELOG.md"

# TWO NAMES, ONE ENTRY POINT. `m365g` is the command a person is asked to
# memorise and types dozens of times; an executable does not have to repeat the
# product's name back at whoever is running it. `m365-governance` stays as a
# compatibility alias, because scripts, runbooks and consumers that invoke this
# engine as a subprocess already use it, and breaking those buys nothing.
#
# NOTHING ELSE IS RENAMED. Not the distribution, not the Python package, not
# the schema `$id`s, not the `produced_by` provenance string, not the
# repository. Those identify the product and appear inside artefacts that
# already exist in the world; this line is about ergonomics at a prompt.
# Charter `D87`.
[project.scripts]
m365g = "m365_governance.cli:main"
m365-governance = "m365_governance.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
# The product's content ships inside the package. Without this the wheel holds
# the Python module and none of the rules, profiles, schemas or collectors it
# exists to run, and nine of ten commands fail outside a checkout.
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# EVERYTHING UNDER `data`, DISCOVERED RATHER THAN LISTED.
#
# This was a list of globs naming the directories somebody remembered, and it
# was wrong three times in the same way. `collectors/**/*.ps1` shipped a
# collector that could not import one of its own `.psm1` modules. Then the
# whole list named directories only, so `data/live-proof.json` — the register
# the proof ladder is derived from — never entered the wheel at all, and
# `m365-governance capabilities` raised `FileNotFoundError` on every installed
# engine while every gate stayed green.
#
# THE DEFECT IS THE SHAPE, NOT THE ENTRIES. A positive enumeration of an open
# set is a list somebody has to remember to extend, at the moment they are
# thinking about something else. The set of files this product needs at runtime
# grows; the list did not grow with it, and nothing said so.
#
# So the pattern is total and the EXCLUSIONS are what is declared, in
# `tests/test_distribution.py`, where each one carries the reason it is not
# product data. A file added to `data/` now ships unless somebody writes down
# why it should not.
"m365_governance.data" = ["**/*"]

# THE OTHER HALF OF THE RULE. Discovery without exclusion ships whatever the
# machine that built the wheel happened to leave lying about. These are the
# only files under `data` that are not product: they are this interpreter's
# own cache, they differ between machines, and a wheel carrying them is a
# wheel whose contents depend on who built it.
#
# Anything else added here needs the same kind of sentence. "It is not needed"
# is not one: a file the runtime does not read today is a file the gate should
# be told about, not one somebody quietly drops.
[tool.setuptools.exclude-package-data]
"m365_governance.data" = ["**/__pycache__/**", "**/*.pyc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 88
src = ["src", "tools", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# The tests import fixtures from conftest by name, which ruff reads as a
# shadowed builtin in a couple of places, and they use bare asserts by design.
"tests/*" = ["S101"]

[tool.coverage.run]
source = ["src/m365_governance"]
branch = true

[tool.coverage.report]
show_missing = true
# The floor is where the project actually is, not where it would be flattering.
# It moves up when something real is covered, never down to accommodate a
# change that stopped testing something.
fail_under = 90
exclude_also = [
  # The subprocess call into PowerShell. Exercised against a tenant, never in
  # CI: a test that mocked it would be testing the mock.
  "raise SystemExit",
  "if __name__ == .__main__.:",
]
